name: Sync PST Locations

on:
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync PST locations
        run: npm run sync:pst-locations

      - name: Commit updated JSON
        run: |
          if git diff --quiet -- app/public/pst-locations.json; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/public/pst-locations.json
          git commit -m "chore: sync PST locations"
          git push origin HEAD:main
